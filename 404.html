<style>
:root{--ink:#0b0c0f;--gold:#c9b38a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--ink);color:#fff;font:400 16px/1.6 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}

.code{font:500 12px "JetBrains Mono",monospace;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
h1{font:300 clamp(34px,6vw,56px)/1.05 Jost,sans-serif;letter-spacing:-.02em;margin:14px 0 18px}
h1 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--gold)}
p{color:rgba(255,255,255,.65);margin:0 0 36px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;height:50px;padding:0 26px;font:500 12px Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(255,255,255,.4);color:#fff;transition:all .3s}
a.btn:first-child{background:#fff;color:var(--ink);border-color:#fff}
a.btn:hover{border-color:var(--gold);background:var(--gold);color:var(--ink)}
</style>
